output_dir: crates/nativeapi/src

clang_flags:
  - -x
  - c++
  - -std=c++17

entry_headers:
  - crates/cnativeapi/cxx_impl/src/url_opener.h

include_paths:
  - crates/cnativeapi/cxx_impl/src
  - crates/cnativeapi/cxx_impl/include

mapping:
  language: rust
  output_note: Generated wrapper from C++ API. Calls existing C API FFI bindings.

  types:
    void: ()
    bool: bool
    _Bool: bool
    char: ::core::ffi::c_char
    cstring: "*const ::core::ffi::c_char"
    string: "*const ::core::ffi::c_char"
    short: i16
    int: i32
    long: i64
    "long long": i64
    "unsigned char": u8
    "unsigned short": u16
    "unsigned int": u32
    "unsigned long": u64
    "unsigned long long": u64
    float: f32
    double: f64
    int8_t: i8
    int16_t: i16
    int32_t: i32
    int64_t: i64
    uint8_t: u8
    uint16_t: u16
    uint32_t: u32
    uint64_t: u64
    size_t: usize
    "void*": "*mut ::core::ffi::c_void"
    "const void*": "*const ::core::ffi::c_void"
    "char*": "*mut ::core::ffi::c_char"
    "const char*": "*const ::core::ffi::c_char"

  options:
    # String param conversion (empty == no auto-generated setup/cleanup lines).
    # Rust uses *const c_char directly, no conversion needed.
    string_param_setup: ""
    string_param_cleanup: ""
    native_name_suffix: "Native"

    # UrlOpener is stateless — no instance handle needed at the C level.
    singleton_classes:
      - UrlOpener

    # Rust has no property concept — disable getter detection entirely.
    property_getter_prefixes: []
    property_bool_prefixes: []

    formatters:
      - name: rustfmt
        cmd:
          - find
          - "{out_dir}"
          - -name
          - "*.rs"
          - -exec
          - rustfmt
          - "{}"
          - +
        continue_on_error: true

    symbol_overrides:
      nativeapi::RunApp: native_run_app
      nativeapi::Application::GetInstance: native_application_get_instance
      nativeapi::Window::Window: native_window_create

filters:
  allowlist_regex: []
  denylist_regex: []
  exclude_dirs:
    - capi
    - platform
