[workspace]
resolver = "2"
members = ["shared", "capi", "bindings"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
heck = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
codegen-shared = { path = "shared" }
