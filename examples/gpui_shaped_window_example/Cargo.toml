[package]
name = "gpui_shaped_window_example"
version = "0.1.0"
edition = "2021"
publish = false

# Kept out of the root workspace: gpui is a large dependency with its own
# platform requirements, and the workspace CI builds every member.
[workspace]

[dependencies]
nativeapi = { path = "../../bindings/rust/nativeapi" }
# Compile shaders at startup: no Metal toolchain needed to build on macOS.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
# The gallery thumbnails are rasterized once into `gpui::RenderImage`s, whose
# frames are `image` buffers (the version gpui itself uses).
image = { version = "0.25", default-features = false }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
