<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/ui/style.css" />
  </head>
  <body>
    <!-- Eight resize handles, inset from the window edge on purpose, so it is
         clear the page does the resizing, not the native frame. -->
    <div class="edge" data-edge="Top"></div>
    <div class="edge" data-edge="Bottom"></div>
    <div class="edge" data-edge="Left"></div>
    <div class="edge" data-edge="Right"></div>
    <div class="edge" data-edge="TopLeft"></div>
    <div class="edge" data-edge="TopRight"></div>
    <div class="edge" data-edge="BottomLeft"></div>
    <div class="edge" data-edge="BottomRight"></div>
    <main>
      <header id="bar">Drag here to move</header>
      <section>
        <h1 id="size"></h1>
        <p>Double-click the bar to maximize, drag the tinted frame to resize.</p>
        <p id="clicks">Clicks: 0</p>
        <button id="add" class="filled">+1</button>
        <button id="edges">Edges: all</button>
      </section>
    </main>
    <script type="module" src="/ui/app.js"></script>
  </body>
</html>
