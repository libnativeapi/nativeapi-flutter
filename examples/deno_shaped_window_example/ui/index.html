<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/ui/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      // One page for both windows: the preview window loads /preview.
      const page = location.pathname.startsWith("/preview") ? "preview" : "controls";
      document.body.dataset.page = page;
      import(`/ui/${page}.js`);
    </script>
  </body>
</html>
