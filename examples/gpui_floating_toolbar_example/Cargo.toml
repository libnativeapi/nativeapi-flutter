[package]
name = "gpui_floating_toolbar_example"
version = "0.1.0"
edition = "2021"
publish = false

# Kept out of the root workspace: gpui is a large dependency with its own
# platform requirements, and the workspace CI builds every member.
[workspace]

[dependencies]
nativeapi = { path = "../../bindings/rust/nativeapi" }
nativeapi_gpui = { path = "../../bindings/rust/nativeapi_gpui" }
# Compile shaders at startup: no Metal toolchain needed to build on macOS.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
