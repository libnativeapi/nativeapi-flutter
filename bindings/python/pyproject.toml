[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "nativeapi"
version = "0.1.0.dev0"
description = "Native desktop APIs (windows, tray icons, menus, displays, shortcuts, dialogs, storage) for Python."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Desktop Environment",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/libnativeapi/nativeapi"

[dependency-groups]
dev = ["pytest>=8"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.24"
wheel.packages = ["nativeapi"]
# ctypes only: one wheel per platform serves every Python 3 version.
wheel.py-api = "py3"
sdist.include = ["cxx_impl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Wheels for python-release.yml. The library is loaded with ctypes, so a
# single CPython build per platform yields the py3-none wheel for all of them.
[tool.cibuildwheel]
build = "cp312-*"
skip = "*-musllinux_*"
test-command = "python -c \"import nativeapi; assert nativeapi.Color.from_hex('#ff8000').g == 128\""

[tool.cibuildwheel.linux]
# manylinux_2_28 (AlmaLinux 8) has GTK 3 in its repositories.
before-all = "dnf install -y gtk3-devel libX11-devel libXi-devel"
# The desktop stack comes from the user's system, never from the wheel: a
# second copy of GLib or GTK in the process breaks both.
repair-wheel-command = """auditwheel repair -w {dest_dir} {wheel} \
  --exclude libgtk-3.so.0 --exclude libgdk-3.so.0 --exclude libpangocairo-1.0.so.0 \
  --exclude libpango-1.0.so.0 --exclude libharfbuzz.so.0 --exclude libatk-1.0.so.0 \
  --exclude libcairo-gobject.so.2 --exclude libcairo.so.2 --exclude libgdk_pixbuf-2.0.so.0 \
  --exclude libgio-2.0.so.0 --exclude libgobject-2.0.so.0 --exclude libglib-2.0.so.0 \
  --exclude libX11.so.6 --exclude libXi.so.6"""

[tool.cibuildwheel.macos]
archs = ["universal2"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
