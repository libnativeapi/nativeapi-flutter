name: nativeapi_workspace
publish_to: none
environment:
  sdk: ^3.13.0

workspace:
  - examples/flutter_browser_tabs_example
  - examples/flutter_cocoapods_example
  - examples/flutter_detachable_window_example
  - examples/flutter_drag_drop_example
  - examples/flutter_shaped_window_example
  - examples/flutter_floating_toolbar_example
  - examples/flutter_launch_at_login_example
  - examples/flutter_display_example
  - examples/flutter_menu_example
  - examples/flutter_multiple_window_example
  - examples/flutter_storage_example
  - examples/flutter_tray_icon_example
  - examples/flutter_url_opener_example
  - examples/flutter_visual_effect_example
  - examples/flutter_window_drag_areas_example
  - examples/flutter_window_example
  - examples/flutter_window_title_bar_example
  - bindings/dart/cnativeapi
  - bindings/dart/nativeapi
  - bindings/dart/nativeapi_flutter/example
  - bindings/dart/nativeapi_flutter

dev_dependencies:
  melos: ^7.1.1

melos:
  packages:
    - bindings/dart/**
    - examples/flutter_*

  ignore:
    - "**/build/**"
    - "**/.dart_tool/**"
    - "**/.symlinks/**"
    - "**/Pods/**"

  command:
    bootstrap:
      runPubGetInParallel: true

  scripts:
    format:
      description: Check Dart formatting for the whole repo.
      run: dart run melos exec --fail-fast -- dart format --output=none --set-exit-if-changed .

    analyze:
      description: Run Flutter analyze for every package/example.
      run: dart run melos exec --concurrency=1 --fail-fast -- flutter analyze --no-fatal-infos --no-fatal-warnings

    test:
      description: Run Flutter tests for packages/examples that have a test/ directory.
      run: dart run melos exec --concurrency=1 --fail-fast -- flutter test
      packageFilters:
        dirExists: test

    codegen:cnativeapi:
      description: Regenerate the cnativeapi ffigen bindings.
      run: ./codegen ffigen
