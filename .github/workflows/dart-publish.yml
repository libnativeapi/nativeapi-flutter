name: Dart Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  publish:
    name: Dart Publish
    permissions:
      id-token: write # Required for requesting the JWT
      contents: write # Required for creating the GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout core
        run: git submodule update --init core

      # Set up the Dart SDK and provision the OIDC token used for publishing.
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260

      # Download Flutter SDK - needed for publishing Flutter packages.
      # Same version as CI, so a dry run here matches what CI analyzed.
      - uses: flutter-actions/setup-flutter@18c66a64fb6f6d3338c63cabbc5cd6da395e7f1d
        with:
          channel: stable
          version: 3.47.5

      # The cnativeapi package must carry core's sources: copy them into
      # cxx_impl/ (untracked; the CMake build prefers it when present) and point
      # the Apple source wrappers there. The rewritten wrappers go into a local
      # commit that is never pushed, because `dart pub publish` warns about
      # modified checked-in files.
      - name: Vendor core into cnativeapi
        run: |
          mkdir bindings/dart/cnativeapi/cxx_impl
          git -C core archive HEAD | tar -x -C bindings/dart/cnativeapi/cxx_impl
          python3 bindings/dart/cnativeapi/codegen.py --core-dir bindings/dart/cnativeapi/cxx_impl --sources-only
          git -c user.name=release -c user.email=release@localhost commit -qam "Point cnativeapi at its vendored core (not pushed)"

      # Publish cnativeapi
      - name: Install dependencies (cnativeapi)
        run: dart pub get
        working-directory: bindings/dart/cnativeapi

      - name: Publish - dry run (cnativeapi)
        run: dart pub publish --dry-run
        working-directory: bindings/dart/cnativeapi

      - name: Publish cnativeapi
        run: dart pub publish -f
        working-directory: bindings/dart/cnativeapi

      # Publish nativeapi
      - name: Install dependencies (nativeapi)
        run: dart pub get
        working-directory: bindings/dart/nativeapi

      - name: Publish - dry run (nativeapi)
        run: dart pub publish --dry-run
        working-directory: bindings/dart/nativeapi

      - name: Publish nativeapi
        run: dart pub publish -f
        working-directory: bindings/dart/nativeapi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${args[@]}"

      # Publish nativeapi_flutter. Last on purpose: pub.dev only accepts a
      # package's first version from `dart pub publish` run by hand, and
      # automated publishing (tag pattern v{{version}}) has to be enabled on its
      # admin page afterwards. Until then this step fails without holding up the
      # packages and the release above.
      - name: Install dependencies (nativeapi_flutter)
        run: dart pub get
        working-directory: bindings/dart/nativeapi_flutter

      - name: Publish - dry run (nativeapi_flutter)
        run: dart pub publish --dry-run
        working-directory: bindings/dart/nativeapi_flutter

      - name: Publish nativeapi_flutter
        run: dart pub publish -f
        working-directory: bindings/dart/nativeapi_flutter
