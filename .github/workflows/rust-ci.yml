name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - "bindings/rust/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "bindings/rust/**"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: bindings/rust

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rust binding submodules
        working-directory: .
        run: git submodule update --init --recursive -- bindings/rust
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libgtk-3-dev libx11-dev libxi-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/rust
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rust binding submodules
        working-directory: .
        run: git submodule update --init --recursive -- bindings/rust
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libgtk-3-dev libx11-dev libxi-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/rust
      - name: Build libraries and all examples
        run: cargo build --workspace --all-targets --release --locked
      - name: Run unit and native integration tests
        run: cargo test --workspace --all-targets --release --locked
      - name: Run documentation tests
        run: cargo test --workspace --doc --release --locked
