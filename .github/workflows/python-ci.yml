name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "bindings/python/**"
      - "core"
      - "examples/python_*/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "bindings/python/**"
      - "core"
      - "examples/python_*/**"
      - ".github/workflows/python-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout core
        run: git submodule update --init core
      - uses: astral-sh/setup-uv@v6
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libgtk-3-dev libx11-dev libxi-dev xvfb
      - name: Lint
        working-directory: bindings/python
        run: uvx ruff check nativeapi tests --select E,F,W,B,UP,I
      - name: Build the library
        working-directory: bindings/python
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Test
        working-directory: bindings/python
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          cmd="uvx --with pytest pytest"
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a $cmd; else $cmd; fi
      - name: Build the wheel
        working-directory: bindings/python
        run: uv build --wheel
